name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Parent Module

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ----------------------------------------------------------
      # 1. GITLEAKS - Secret Scanning
      # ----------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true


      # ----------------------------------------------------------
      # 2. TFLINT - Terraform Linting
      # ----------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        continue-on-error: true
        run: |
          tflint --init
          tflint


      # ----------------------------------------------------------
      # 3. TFSEC - Terraform Security Scan
      # ----------------------------------------------------------
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3


      # ----------------------------------------------------------
      # 4. CHECKOV - IaC Security & Compliance
      # ----------------------------------------------------------
    #   - name: Run Checkov
    #     uses: bridgecrewio/checkov-action@v12
    #     with:
    #       directory: environment
     
      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "a8e64ef7-de93-460e-bab9-c984d9b5ee78" \
            --password "PRL8Q~FWND2S5JODARQyRBLkN9X2ObAW7qJ.ZanL" \
            --tenant "a9e24e7c-aca7-4fa6-b4e2-c82fe26352dc"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "705d038c-7187-42ac-8cbf-06356d2c6647"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: Parent Module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Checkov
        continue-on-error: true
        run: |
         checkov -d . --soft-fail

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "a8e64ef7-de93-460e-bab9-c984d9b5ee78" \
            --password "PRL8Q~FWND2S5JODARQyRBLkN9X2ObAW7qJ.ZanL" \
            --tenant "a9e24e7c-aca7-4fa6-b4e2-c82fe26352dc"

      - name: Set Azure Subscription
        run: |
          az account set \
           --subscription "705d038c-7187-42ac-8cbf-06356d2c6647"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
